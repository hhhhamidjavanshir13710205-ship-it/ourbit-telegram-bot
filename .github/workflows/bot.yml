name: Ourbit Crypto Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Test Ourbit Domains
        run: |
          echo "================================"
          echo "OURBIT DOMAIN TEST"
          echo "================================"

          echo ""
          echo "1. contract.ourbit.com"
          getent hosts contract.ourbit.com || echo "DNS FAILED"

          echo ""
          echo "2. futures.ourbit.com"
          getent hosts futures.ourbit.com || echo "DNS FAILED"

          echo ""
          echo "3. www.ourbit.com"
          getent hosts www.ourbit.com || echo "DNS FAILED"

      - name: Test Contract API
        run: |
          echo "================================"
          echo "OURBIT CONTRACT API TEST"
          echo "================================"

          curl -v \
            --connect-timeout 15 \
            --max-time 30 \
            "https://contract.ourbit.com/api/v1/contract/ping" \
            || true

      - name: Test Futures API
        run: |
          echo "================================"
          echo "OURBIT FUTURES API TEST"
        curl -v \
            --connect-timeout 15 \
            --max-time 30 \
            "https://futures.ourbit.com/api/v1/contract/ping" \
            || true

      - name: Run python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Test Symbols API
        run: |
          python test_symbols.py

      - name: Test Kline API
        run: |
          python test_kline.py
