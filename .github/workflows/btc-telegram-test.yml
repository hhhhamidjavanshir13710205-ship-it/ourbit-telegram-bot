name: BTC Telegram Test

on:
  workflow_dispatch:

jobs:
  btc-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send BTC 1H to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import requests
          import os
          from datetime import datetime, timezone

          # Get BTC 1H candle
          url = "https://api.ourbit.com/api/v3/klines"

          params = {
              "symbol": "BTCUSDT",
              "interval": "60m",
              "limit": 1
          }

          r = requests.get(
              url,
              params=params,
              timeout=20
          )

          r.raise_for_status()

          candle = r.json()[0]

          time = datetime.fromtimestamp(
              int(candle[0]) / 1000,
              tz=timezone.utc
          )

          message = f"""
📊 BTCUSDT 1H

🕒 Time: {time}

Open: {candle[1]}
High: {candle[2]}
Low: {candle[3]}
Close: {candle[4]}
Volume: {candle[5]}

✅ Ourbit Data Test
"""

          # Send Telegram message
          tg_url = (
              f"https://api.telegram.org/bot"
              f"{os.environ['TELEGRAM_TOKEN']}/sendMessage"
          )

          payload = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message
          }

          tg = requests.post(
              tg_url,
              json=payload,
              timeout=20
          )

          print("Telegram status:", tg.status_code)
          print(tg.text)

          tg.raise_for_status()

          print("✅ Telegram message sent")
          PY
