name: BTC 1H Signal Telegram V3

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test BTC 1H API
        run: |
          echo "Testing BTCUSDT 1H candles..."

          curl -L \
            -A "Mozilla/5.0" \
            --max-time 30 \
            -sS \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://futures.ourbit.com/api/v1/contract/kline/BTCUSDT?interval=60m&limit=10"

          echo "Test finished."
