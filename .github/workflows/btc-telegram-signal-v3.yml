name: ETH 15M Signal Telegram V3

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test ETH 15M API
        run: |
          echo "Testing ETHUSDT 15M candles..."

          curl -L \
            -A "Mozilla/5.0" \
            --max-time 30 \
            -sS \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://futures.ourbit.com/api/v1/contract/kline/ETHUSDT?interval=15m&limit=20"

          echo "Test finished."
