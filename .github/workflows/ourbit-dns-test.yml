name: Ourbit DNS Test

on:
  workflow_dispatch:

jobs:
  test-ourbit-dns:
    runs-on: ubuntu-latest

    steps:
      - name: Test DNS resolution
        run: |
          echo "Testing Ourbit DNS..."
          getent hosts contract.ourbit.com
          nslookup contract.ourbit.com
          curl -I --connect-timeout 10 https://contract.ourbit.com
