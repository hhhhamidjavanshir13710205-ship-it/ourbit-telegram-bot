name: Ourbit DNS Test

on:
  workflow_dispatch:

jobs:
  test-ourbit-dns:
    runs-on: ubuntu-latest

    steps:
      - name: Test DNS resolution
             run: |
          echo "Testing Ourbit DNS..."
          echo "=== getent ==="
          getent hosts contract.ourbit.com || true

          echo "=== nslookup ==="
          nslookup contract.ourbit.com || true

          echo "=== curl ==="
          curl -I --connect-timeout 10 https://contract.ourbit.com || true 
