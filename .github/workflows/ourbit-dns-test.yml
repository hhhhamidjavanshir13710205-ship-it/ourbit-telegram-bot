name: Ourbit DNS Test

on:
  workflow_dispatch:

jobs:
  test-ourbit-dns:
    runs-on: ubuntu-latest

    steps:
      - name: Test Ourbit DNS and Connection
        run: |
          echo "================================"
          echo "Ourbit DNS Test"
          echo "================================"

          echo ""
          echo "=== GETENT ==="
          getent hosts contract.ourbit.com || echo "getent FAILED"

          echo ""
          echo "=== NSLOOKUP ==="
          nslookup contract.ourbit.com || echo "nslookup FAILED"

          echo ""
          echo "=== CURL ==="
          curl -I --connect-timeout 10 https://contract.ourbit.com || echo "curl FAILED"

          echo ""
          echo "================================"
          echo "DNS test finished"
          echo "================================"
