name: Test BTC 1H Final

on:
  workflow_dispatch:

jobs:
  test-btc-1h:
    runs-on: ubuntu-latest

    steps:
      - name: Get BTCUSDT 1H Candles
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime, timezone

          url = "https://api.ourbit.com/api/v3/klines"

          params = {
              "symbol": "BTCUSDT",
              "interval": "60m",
              "limit": 5
          }

          print("======================================")
          print("🧪 OURBIT BTCUSDT 1H FINAL TEST")
          print("======================================")
          print("Symbol   :", params["symbol"])
          print("Interval :", params["interval"])
          print("")

          r = requests.get(
              url,
              params=params,
              timeout=20
          )

          print("HTTP Status:", r.status_code)
          print("")

          if r.status_code != 200:
              print("API ERROR:")
              print(r.text)

          r.raise_for_status()

          candles = r.json()

          print("📊 LAST 5 BTC 1H CANDLES")
          print("--------------------------------------")

          for i, candle in enumerate(candles, 1):

              dt = datetime.fromtimestamp(
                  int(candle[0]) / 1000,
                  tz=timezone.utc
              )

              print(f"Candle #{i}")
              print(f"Time  : {dt}")
              print(f"Open  : {candle[1]}")
              print(f"High  : {candle[2]}")
              print(f"Low   : {candle[3]}")
              print(f"Close : {candle[4]}")
              print(f"Volume: {candle[5]}")
              print("--------------------------------------")

          print("")
          print("✅ BTCUSDT 1H TEST SUCCESSFUL")
          PY
