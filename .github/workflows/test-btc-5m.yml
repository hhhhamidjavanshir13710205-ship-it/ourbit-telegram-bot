name: Test BTC 5M Futures

on:
  workflow_dispatch:

jobs:
  test-btc-5m:
    runs-on: ubuntu-latest

    steps:
      - name: Test Ourbit BTCUSDT 5M
        run: |
          python - <<'PY'
          import requests
          import json
          from datetime import datetime, timezone

          print("======================================")
          print("🧪 OURBIT BTC/USDT FUTURES - 5M TEST")
          print("======================================")

          url = "https://contract.ourbit.com/api/v1/contract/kline/BTC_USDT"

          params = {
              "interval": "Min5"
          }

          print("📡 Connecting to Ourbit Futures...")
          print(f"Symbol   : BTC_USDT")
          print(f"Interval : Min5")
          print("")

          response = requests.get(
              url,
              params=params,
              timeout=20
          )

          print(f"HTTP Status: {response.status_code}")
          print("")

          print("📦 RAW RESPONSE:")
          print(response.text[:5000])

          response.raise_for_status()

          data = response.json()

          print("")
          print("======================================")
          print("✅ API RESPONSE RECEIVED")
          print("======================================")

          print(json.dumps(data, indent=2, ensure_ascii=False))

          print("")
          print("🕐 Test time:")
          print(datetime.now(timezone.utc).isoformat())

          print("")
          print("🎉 BTC 5M FUTURES TEST FINISHED")
          PY
