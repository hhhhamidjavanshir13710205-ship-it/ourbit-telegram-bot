name: Test BTC 5M

on:
  workflow_dispatch:

jobs:
  test-btc-5m:
    runs-on: ubuntu-latest

    steps:
      - name: Test Ourbit BTC 5M
        run: |
          python - <<'PY'
          import requests
          import json

          url = "https://api.ourbit.com/api/v3/klines"

          params = {
              "symbol": "BTCUSDT",
              "interval": "5m",
              "limit": 5
          }

          print("======================================")
          print("🧪 OURBIT BTC/USDT - 5M TEST")
          print("======================================")
          print("URL:", url)
          print("Symbol:", params["symbol"])
          print("Interval:", params["interval"])
          print("")

          response = requests.get(
              url,
              params=params,
              timeout=20
          )

          print("HTTP Status:", response.status_code)
          print("")
          print("RAW RESPONSE:")
          print(response.text)

          response.raise_for_status()

          data = response.json()

          print("")
          print("======================================")
          print("✅ API RESPONSE RECEIVED")
          print("======================================")

          for candle in data:
              print(
                  "Time:", candle[0],
                  "| Open:", candle[1],
                  "| High:", candle[2],
                  "| Low:", candle[3],
                  "| Close:", candle[4],
                  "| Volume:", candle[5]
              )

          print("")
          print("🎉 BTC 5M TEST FINISHED")
          PY
