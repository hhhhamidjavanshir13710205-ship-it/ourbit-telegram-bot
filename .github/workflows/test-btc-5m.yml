name: Test BTC 5M Kline

on:
  workflow_dispatch:

jobs:
  test-btc-5m:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test BTCUSDT 5M Kline
        run: |
          python - <<'PY'
          import requests
          import json
          from datetime import datetime, timezone

          print("======================================")
          print("🧪 OURBIT BTC/USDT FUTURES - 5M TEST")
          print("======================================")

          url = "https://api.ourbit.com/api/v1/contract/kline"

          params = {
              "symbol": "BTCUSDT",
              "interval": "5m",
              "limit": 5
          }

          print("📡 Connecting to Ourbit...")
          print(f"Symbol   : {params['symbol']}")
          print(f"Interval : {params['interval']}")
          print(f"Limit    : {params['limit']}")
          print("")

          response = requests.get(
              url,
              params=params,
              timeout=20
          )

          print(f"HTTP Status: {response.status_code}")
          print("")

          response.raise_for_status()

          data = response.json()

          print("📦 RAW API RESPONSE:")
          print(json.dumps(data, indent=2, ensure_ascii=False))

          print("")
          print("======================================")
          print("✅ API RESPONSE RECEIVED")
          print("======================================")

          # نمایش چند کندل آخر در صورت وجود ساختار لیستی
          candles = None

          if isinstance(data, list):
              candles = data

          elif isinstance(data, dict):
              for key in ["data", "result", "rows", "list"]:
                  if isinstance(data.get(key), list):
                      candles = data[key]
                      break

          if candles:
              print("")
              print("📊 LAST CANDLES:")

              for candle in candles:
                  print(candle)

          print("")
          print("🕐 Test time:")
          print(datetime.now(timezone.utc).isoformat())

          print("")
          print("🎉 BTC 5M TEST FINISHED")
          PY
