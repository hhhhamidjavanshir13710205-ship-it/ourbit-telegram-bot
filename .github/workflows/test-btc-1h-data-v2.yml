name: Test BTC 1H Data V2

on:
  workflow_dispatch:

jobs:
  test-btc-1h-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get BTCUSDT 1H Candles
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime, timezone

          url = "https://api.ourbit.com/api/v3/klines"

          params = {
              "symbol": "BTCUSDT",
              "interval": "Min60",
              "limit": 5
          }

          print("======================================")
          print("🧪 OURBIT BTCUSDT 1H DATA")
          print("======================================")
          print("Symbol   :", params["symbol"])
          print("Interval :", params["interval"])
          print("")

          response = requests.get(
              url,
              params=params,
              timeout=20
          )

          print("HTTP Status:", response.status_code)
          print("")

          if response.status_code != 200:
              print("❌ API ERROR:")
              print(response.text)

          response.raise_for_status()

          data = response.json()

          print("📊 LAST 5 CANDLES")
          print("--------------------------------------")

          for i, candle in enumerate(data, 1):

              timestamp = int(candle[0])

              dt = datetime.fromtimestamp(
                  timestamp / 1000,
                  tz=timezone.utc
              )

              print(f"Candle #{i}")
              print(f"Time   : {dt}")
              print(f"Open   : {candle[1]}")
              print(f"High   : {candle[2]}")
              print(f"Low    : {candle[3]}")
              print(f"Close  : {candle[4]}")
              print(f"Volume : {candle[5]}")
              print("--------------------------------------")

          print("")
          print("✅ BTCUSDT 1H DATA TEST SUCCESSFUL")
          PY
